<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor fit on your desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--ink:#1b1f24;--mute:#5b6470;--line:#d9dde3;--rule:#eef0f3;--card:#fff;--soft:#f2f4f6;--dash-soft:#e3a6cf;--sel-bg:#eaf1ff;--sel-ink:#1d4ed8;--sel-line:#bfd3fb;--accent:#2563eb;--shelfline:#aab2bd;--desk:#fff;--bezel:#1b1f24;--mine-ink:#a3307e}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--ink:#e6e9ee;--mute:#9aa3ae;--line:#2c323a;--rule:#232930;--card:#181c21;--soft:#232930;--dash-soft:#7a3d66;--sel-bg:#172554;--sel-ink:#9db8ff;--sel-line:#1e3a8a;--accent:#5b8cff;--shelfline:#4a525d;--desk:#20252c;--bezel:#0b0d10;--mine-ink:#e88cc8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
button,input{font:inherit;color:inherit}
button{border-radius:0}
main{margin:0;padding:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;margin:0;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;background:var(--accent);border:0}
input[type=range]::-moz-range-track{height:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;background:var(--accent);border:0;border-radius:0}
input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:12px;height:12px;margin:0;border:1px solid var(--shelfline);border-radius:0;background:var(--card);cursor:pointer}
input[type=checkbox]:hover{border-color:var(--mute)}
input[type=checkbox]:checked{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 2px var(--card)}
input[type=checkbox]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;width:100%;height:auto}
svg.iso polygon.q{cursor:crosshair}
/* top bar */
.brand{padding:14px 16px;font-weight:700;font-size:15px;letter-spacing:.08em;border-bottom:1px solid var(--line)}
/* layout */
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);align-items:start}
.content{padding:24px;min-width:0}
.side{background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
.blk{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.blk.sm{font-size:10px;gap:8px}
.blk.sm .lbl{font-size:9px}
.blk:last-child{border-bottom:0}
.side{display:flex;flex-direction:column}
.side>*{flex:none}
.credit{margin-top:auto;padding:12px 16px;font-size:10px;color:var(--mute)}
.credit b{font-size:10px;font-weight:500;color:var(--ink)}
.credit a{color:inherit}
.lbl{font-size:11px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;font-weight:700}
.field{display:flex;align-items:center;gap:10px;min-height:32px;line-height:1;padding:0 12px;border:1px solid var(--line);background:var(--card);text-align:left;cursor:pointer;width:100%}
.field .nm{flex:1 1 auto}
.field.dashed{border-style:dashed;border-color:var(--shelfline);gap:8px}
.field.dashed .hi{margin-left:-2px}
.field .tx{padding-top:1px}
.sw{width:12px;height:12px;flex:none}
.list{display:flex;flex-direction:column;border:1px solid var(--line)}
.list:empty{display:none}
.list button{display:flex;align-items:center;gap:10px;min-height:32px;padding:0 12px;border:0;border-bottom:1px solid var(--line);background:var(--card);text-align:left;cursor:pointer}
.list button:last-child{border-bottom:0}
.list button .nm{flex:1 1 auto}
.list button .st{color:var(--mute)}
.list button[aria-pressed=true]{background:var(--sel-bg);color:var(--sel-ink)}
.list button[aria-pressed=true] .st{color:var(--sel-ink)}
.anchors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line)}
.anchors button{min-height:26px;border:0;border-bottom:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.anchors button:nth-child(odd):not([data-p=bc]){border-right:1px solid var(--line)}
.anchors [data-p=bc]{grid-column:1/-1;border-bottom:0}
.anchors button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--sel-bg);color:var(--sel-ink)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.seg button{min-height:24px;border:0;border-right:1px solid var(--line);background:var(--card);cursor:pointer}
.seg button:last-child{border-right:0}
.fld{display:flex;flex-direction:column;gap:4px}
.fl{display:flex;justify-content:space-between;color:var(--mute);text-transform:uppercase}
.fl b{color:var(--ink);font-weight:700}
.fl.sm{font-size:9px;letter-spacing:.06em}
label.ck{display:flex;align-items:center;gap:10px;min-height:20px;cursor:pointer;text-transform:uppercase}
.plain{min-height:26px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:6px}
svg.hi{flex:none;display:block}
svg.hi[width="12"]{width:12px;height:12px}
svg.hi[width="16"]{width:16px;height:16px}
svg.hi[width="18"]{width:18px;height:18px}
/* panels */
.panel{border:1px solid var(--line);background:var(--card)}
.panel+.panel{margin-top:24px}
.phead{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.phead>div{padding:10px 14px}
.pid{font-weight:700;border-right:1px solid var(--line);text-transform:uppercase}
.pdiff{color:var(--mute);flex:1 1 200px}
.duo{display:grid;grid-template-columns:1fr 1fr}
.half{height:clamp(320px,60vh,720px);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.half+.half{border-left:1px solid var(--line)}
.half svg{flex:1 1 0;min-height:0;height:100%}
.hl{font-size:11px;letter-spacing:.1em;color:var(--mute)}
#panels.multi .half{height:auto}
#panels.multi .half svg{flex:none;height:auto}
.foot{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);font-size:12px}
.foot>*{padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;text-transform:uppercase}
.foot>.legend{border-left:1px solid var(--line);color:var(--mute)}
.foot span{display:flex;align-items:center;gap:8px}
.key i{width:14px;height:10px;display:inline-block}
.lg{width:10px;height:10px;display:inline-block;border:1px solid var(--ink)}
.lg.a{background:#fff6c8}.lg.b{background:transparent}.lg.c{background:var(--ink)}
@media (max-width:1100px){.duo,.foot{grid-template-columns:1fr}.half{height:auto}.half svg{flex:none;height:auto}.half+.half,.foot>.legend{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}.content{padding:16px}}
/* pickers */
.pickdlg{border:0;padding:48px 24px;background:transparent;max-width:none;max-height:none;width:100vw;height:100vh;margin:0}
.pickdlg::backdrop{background:rgba(27,31,36,.42)}
.pickdlg[open]{display:flex;justify-content:center;align-items:flex-start}
.dlg{width:100%;max-width:1080px;max-height:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);display:flex;flex-direction:column}
.dhead{display:flex;flex-wrap:wrap;align-items:stretch;border-bottom:1px solid var(--line)}
.dt{padding:14px 20px;font-weight:700;letter-spacing:.08em;border-right:1px solid var(--line);display:flex;align-items:center}
.dsearch{flex:1 1 320px;display:flex;align-items:center;gap:12px;padding:0 20px;min-height:52px}
.dsearch input{background:transparent;border:0;outline:none;width:100%;min-width:0;padding:0}
.kbd{border:1px solid var(--line);padding:2px 6px;color:var(--mute);font-size:11px}
.dcount{padding:14px 20px;border-left:1px solid var(--line);display:flex;align-items:center;gap:8px;color:var(--mute)}
.dcount b{color:var(--ink)}
.dfilter{display:flex;flex-wrap:wrap;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);align-items:center}
.dfilter .lbl{margin-right:6px}
.dfilter button{min-height:32px;padding:0 12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.dfilter button[aria-pressed=true]{border-color:var(--sel-line);background:var(--sel-bg);color:var(--sel-ink)}
.dfilter .yours{margin-left:auto;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:20px;overflow:auto;min-height:0}
.card{position:relative;display:flex;flex-direction:column;gap:10px;min-height:196px;padding:14px;border:1px solid var(--line);background:var(--card);text-align:left;cursor:pointer}
.card:hover{border-color:var(--shelfline)}
.card.on{border:2px solid var(--sel);padding:13px}
.card .pv{height:100px;border-bottom:1px solid var(--rule);display:flex;align-items:flex-end}
.card .pv svg{height:88px}
.card b{font-size:14px}
.card .meta{color:var(--mute);padding-right:36px}
.grid .more{grid-column:1/-1;height:1px}
.card .ind{position:absolute;right:12px;bottom:12px;width:28px;height:28px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:16px}
.card.on .ind{border-color:var(--sel);color:var(--ink);font-size:14px}
.grid .none{grid-column:1/-1;color:var(--mute);text-align:center;padding:24px}
.dfoot{display:flex;flex-wrap:wrap;align-items:stretch;border-top:1px solid var(--line)}
.dkey{flex:1 1 320px;padding:14px 20px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center}
.dkey span{display:flex;align-items:center;gap:8px}
.dkey i{width:14px;height:10px;border:1.5px dashed #c2459b}
.done{min-height:52px;padding:0 28px;border:0;border-left:1px solid var(--line);background:var(--sel-bg);color:var(--sel-ink);font-weight:700;letter-spacing:.08em;cursor:pointer}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pickdlg{padding:12px}}
</style>
</head>
<body>
<main>
<div class="layout">
<aside class="side">
  <div class="brand">MONITOR/FIT</div>
  <section class="blk">
    <div class="lbl">My monitor</div>
    <button type="button" class="field" id="mineBtn" aria-haspopup="dialog"><span class="sw"></span><span class="nm"></span><svg class="hi" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.25 15 12 18.75 15.75 15m-7.5-6L12 5.25 15.75 9"></path></svg></button>
  </section>

  <section class="blk">
    <div class="lbl">Compare</div>
    <button type="button" class="field dashed" id="cmpBtn" aria-haspopup="dialog"><svg class="hi" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5v15m7.5-7.5h-15"></path></svg><span class="tx">ADD OR REMOVE MONITORS</span></button>
    <div class="list" id="picks"></div>
  </section>

  <section class="blk sm">
    <div class="lbl">Front view · anchor</div>
    <div class="anchors" id="pos">
      <button type="button" data-p="tl" aria-pressed="false" aria-label="Top left"><svg class="hi" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19.5 19.5-15-15m0 0v11.25m0-11.25h11.25"></path></svg>TOP L</button>
      <button type="button" data-p="tr" aria-pressed="false" aria-label="Top right">TOP R<svg class="hi" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 19.5 15-15m0 0H8.25m11.25 0v11.25"></path></svg></button>
      <button type="button" data-p="bl" aria-pressed="false" aria-label="Bottom left"><svg class="hi" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19.5 4.5-15 15m0 0V8.25m0 11.25h11.25"></path></svg>BOT L</button>
      <button type="button" data-p="br" aria-pressed="false" aria-label="Bottom right">BOT R<svg class="hi" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4.5 4.5 15 15m0 0V8.25m0 11.25H8.25"></path></svg></button>
      <button type="button" data-p="bc" aria-pressed="true" aria-label="Bottom centre"><svg class="hi" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 13.5 12 21m0 0-7.5-7.5M12 21V3"></path></svg>BOTTOM CENTRE</button>
    </div>
    <label class="ck"><input type="checkbox" id="ghost" checked> Show my monitor</label>
  </section>

  <section class="blk sm">
    <div class="lbl">Chair view</div>
    <div class="fld"><span class="fl">Desk depth · cm</span>
      <div class="seg" id="depth">
        <button type="button" data-d="600" aria-pressed="false">60</button>
        <button type="button" data-d="700" aria-pressed="true">70</button>
        <button type="button" data-d="800" aria-pressed="false">80</button>
      </div>
    </div>
    <div class="fld"><label class="fl" for="dw"><span>Desk width</span><b id="dwv"></b></label><input type="range" id="dw" min="100" max="300" step="5" value="120"></div>
    <div class="fld"><label class="fl" for="bk"><span>Stand from back</span><b id="bkv"></b></label><input type="range" id="bk" min="0" max="30" step="1" value="0"></div>
    <div class="fld"><label class="fl" for="eye"><span>Eyes behind edge</span><b id="eyev"></b></label><input type="range" id="eye" min="100" max="500" step="50" value="250"></div>
    <div class="fld"><label class="fl" for="yaw"><span>View angle</span><b id="yawv"></b></label><input type="range" id="yaw" min="-55" max="55" step="5" value="30"></div>
    <label class="ck"><input type="checkbox" id="ighost" checked> Show my monitor</label>
    <div class="fld"><span class="fl">Where you look</span>
      <label class="fl sm" for="gy">Left / right</label><input type="range" id="gy" min="-70" max="70" step="1" value="0">
      <label class="fl sm" for="gp">Up / down</label><input type="range" id="gp" min="-45" max="25" step="1" value="0">
    </div>
    <button type="button" class="plain" id="gc"><svg class="hi" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"></path></svg>Gaze back to centre</button>
  </section>
  <footer class="credit">
    <span><b>Data by <a href="https://icecat.biz/" target="_blank" rel="noopener">Icecat</a></b> · <a href="data.html">About the data</a></span>
  </footer>
</aside>
<div class="content">

<div id="panels"></div>
<template id="panelTpl">
<article class="panel">
  <div class="phead"><div class="pid"></div><div class="pdiff"></div></div>
  <div class="duo">
    <div class="half"><div class="hl">FRONT</div><svg class="front" role="img"></svg></div>
    <div class="half"><div class="hl">CHAIR</div><svg class="iso" role="img"></svg></div>
  </div>
  <div class="foot"><div class="key"></div><div class="legend"><span><i class="lg a"></i>≤15° focus</span><span><i class="lg b"></i>15–30° eyes</span><span><i class="lg c"></i>&gt;30° head</span><span>Click or drag on the screen to look there</span></div></div>
</article>
</template>

<dialog id="pick" class="pickdlg" aria-label="Choose your monitor">
  <div class="dlg">
    <div class="dhead">
      <div class="dt">MY MONITOR</div>
      <label class="dsearch"><svg class="hi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"></path></svg><input type="search" id="pq" placeholder="Search monitors, sizes, resolutions" aria-label="Search monitors" autocomplete="off"><span class="kbd">ESC</span></label>
    </div>
    <div class="dfilter" id="pfilter"></div>
    <div class="grid" id="pgrid"></div>
    <div class="dfoot">
      <div class="dkey"><span><i></i>CURRENT, TO SCALE</span><span>CLICK A CARD TO MAKE IT YOURS</span></div>
      <button type="button" class="done" id="pdone">CLOSE</button>
    </div>
  </div>
</dialog>
<dialog id="cpick" class="pickdlg" aria-label="Choose monitors to compare">
  <div class="dlg">
    <div class="dhead">
      <div class="dt">COMPARE</div>
      <label class="dsearch"><svg class="hi" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"></path></svg><input type="search" id="cq" placeholder="Search monitors, sizes, resolutions" aria-label="Search monitors" autocomplete="off"><span class="kbd">ESC</span></label>
      <div class="dcount" id="ccount"></div>
    </div>
    <div class="dfilter" id="cfilter"></div>
    <div class="grid" id="cgrid"></div>
    <div class="dfoot">
      <div class="dkey"><span><i></i>YOUR MONITOR, TO SCALE</span><span>CLICK A CARD TO ADD OR REMOVE IT</span></div>
      <button type="button" class="done" id="cdone">DONE</button>
    </div>
  </div>
</dialog>
</div>
</div>
</main>

<script src="monitor-model.js"></script>
<script src="monitors-data.js"></script>
<script>
// monitors come from the catalogue (monitors-data.js), flattened to what the drawing needs;
// the full list (catalogue/index.json) replaces them once it has loaded
var M=MONITORS.map(toDrawing).filter(Boolean), MI={};
function indexM(){MI={};M.forEach(function(m){MI[m.id]=m;m.hay=(m.name+" "+cm(m.bw)+" "+cm(m.bh)+" "+m.res+" "+m.curve+(m.diag?" "+m.diag+'"':"")).toLowerCase()})}
var LIFT=92;
// my monitor keeps one colour; compared monitors draw from a palette of 30 distinct colours (Glasbey)
var MINE_COLOR="#C2459B", PALETTE=["#d60000","#8c3bff","#018700","#00acc6","#97ff00","#ff7ed1","#6b004f","#ffa52f","#573b00","#005659","#0000dd","#00fdcf","#a17569","#bcb6ff","#95b577","#002e6b","#645474","#790000","#0774d8","#fdf490","#004b00","#8e7900","#ff7266","#edb8b8","#5d7e66","#9ae4ff","#eb0077","#a57bb8","#5900a3","#03c600"];
var st={show:["asus-proart-32-4k"],colors:{},mine:"asus-pa279crv",compare:M.map(function(m){return m.id}),pos:"bc",ghost:true};
var NS="http://www.w3.org/2000/svg", svg=null, panels=[];
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
function tx(x,y,s,a){var e=el("text",Object.assign({x:x,y:y,"font-size":22,fill:"var(--mute)","font-family":"inherit"},a||{}));e.textContent=s;return e}
function mmL(v){return Math.round(v)+" MM"}
function cm(mm){return (Math.round(mm/10*10)/10).toFixed(1).replace(/\.0$/,"")+" cm"}
function byId(id){return MI[id]}
function mine(){return byId(st.mine)}
function colorOf(m){return m.id===st.mine?MINE_COLOR:st.colors[m.id]||"var(--line)"}
// give each compared monitor a random palette colour no other compared monitor has
function assignColors(){
  for(var id in st.colors)if(st.compare.indexOf(id)<0)delete st.colors[id];
  st.compare.forEach(function(id){
    if(st.colors[id])return;
    var used=Object.keys(st.colors).map(function(k){return st.colors[k]}),free=PALETTE.filter(function(c){return used.indexOf(c)<0});
    if(!free.length)free=PALETTE;
    st.colors[id]=free[Math.floor(Math.random()*free.length)];
  });
}
// st.pos names the point of my monitor the compared one shares: b/t + l/c/r
function left(m){var y=mine();return st.pos[1]==="l"?-y.bw/2:st.pos[1]==="c"?-m.bw/2:y.bw/2-m.bw}
function base(m){var y=mine();return st.pos[0]==="b"?LIFT:LIFT+y.bh-m.bh}
function dim(x1,x2,y,label,c,below,tc){

  [[L[0],L[1],cH],[Rr[0],Rr[1],cH]].forEach(function(t){line3(eye,t,{stroke:"var(--ink)","stroke-width":2,"stroke-dasharray":"10 8"})});
  line3(eye,[mid[0],mid[1],cH],{stroke:"var(--ink)","stroke-width":1.5,opacity:.5});
  if(gaze){line3(eye,gaze,{stroke:"#e0a800","stroke-width":3});var gp2=P(gaze[0],gaze[1],gaze[2]);E("circle",{cx:gp2[0],cy:gp2[1],r:12,fill:"#e0a800",stroke:"#000","stroke-width":2})}
  line3(eye,[0,eyeY,-250],{stroke:"var(--ink)","stroke-width":2,"stroke-dasharray":"3 7",opacity:.6});var ep=P(eye[0],eye[1],eye[2]);E("circle",{cx:ep[0],cy:ep[1],r:14,fill:"var(--ink)"});
  var t=E("text",{x:ep[0]-24,y:ep[1]+10,"text-anchor":"end","font-size":30,fill:"var(--ink)","font-weight":600});t.textContent="your eyes, 45 cm above the desk";
  document.getElementById("eyev").textContent=(ist.eye/10)+" cm";
  document.getElementById("dwv").textContent=(ist.W/10)+" cm";
  document.getElementById("bkv").textContent=(ist.back/10)+" cm";
  document.getElementById("yawv").textContent=ist.yaw+"°";
  fit(IS,40);
}
var depth=document.getElementById("depth");
// the gaze sliders reach exactly as far as dragging over the screens does, and start at the first panel's gaze
function syncGaze(){
  var gy=document.getElementById("gy"),gp=document.getElementById("gp");
  gy.min=Math.min.apply(0,panels.map(function(pn){return pn.gyR[0]}));gy.max=Math.max.apply(0,panels.map(function(pn){return pn.gyR[1]}));
  gp.min=Math.min.apply(0,panels.map(function(pn){return pn.gpR[0]}));gp.max=Math.max.apply(0,panels.map(function(pn){return pn.gpR[1]}));
  var g=ist.gaze[panels[0].m.id];if(g){gy.value=g.gy;gp.value=g.gp}
}
function drawIsos(){panels.forEach(drawIso);syncGaze()}
function setGaze(){var gy=+document.getElementById("gy").value,gp=+document.getElementById("gp").value;panels.forEach(function(pn){ist.gaze[pn.m.id]={gy:gy,gp:gp}});drawIsos()}
[].forEach.call(depth.children,function(b){b.onclick=function(){ist.D=+b.dataset.d;[].forEach.call(depth.children,function(c){c.setAttribute("aria-pressed",c===b)});drawIsos()}});
document.getElementById("bk").oninput=function(e){ist.back=+e.target.value*10;drawIsos()};
document.getElementById("dw").oninput=function(e){ist.W=+e.target.value*10;drawIsos()};
document.getElementById("eye").oninput=function(e){ist.eye=+e.target.value;drawIsos()};
document.getElementById("ighost").onchange=function(e){ist.ghost=e.target.checked;drawIsos()};
document.getElementById("yaw").oninput=function(e){ist.yaw=+e.target.value;drawIsos()};
window.addEventListener("pointerup",function(){ist.drag=false});
document.getElementById("gy").oninput=setGaze;
document.getElementById("gp").oninput=setGaze;
document.getElementById("gc").onclick=function(){ist.gaze={};drawIsos()};
draw();
