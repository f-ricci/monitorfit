<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor fit on your desk</title>
<style>
:root{--bg:#f7f6f3;--ink:#1d1d1b;--mute:#6b6a66;--line:#d8d6cf;--shelfline:#c9c6bd;--desk:#e4e1da;--bezel:#1f1f22;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--ink:#eceae4;--mute:#a19f98;--line:#3a3936;--shelfline:#4a4945;--desk:#3a3834;--bezel:#0c0c0d;--card:#262624}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
main{margin:0;padding:0}
.pill{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--mute);margin:0 0 10px}
.legend span{display:flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.lg.a{background:#fff6c8}.lg.b{background:transparent}.lg.c{background:#2a2a2a}
#iso polygon.q{cursor:crosshair}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.bar button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.bar button .sw{width:10px;height:10px;border-radius:3px}
.bar button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:6px 0 14px;color:var(--mute);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:var(--card);color:var(--ink);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
input[type=range]{width:220px}
select{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px}
label.ck{display:flex;gap:6px;align-items:center;cursor:pointer}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.duo{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:0}
.stage.duo{padding:0}
.duo>div{height:clamp(320px,64vh,760px);padding:10px}
.duo svg{height:100%}
.duo>.foot{grid-column:1/-1;height:auto;padding:0;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.foot>*{padding:10px 14px}
.foot>.legend{margin:0;border-left:1px solid var(--line)}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute)}
.key span{display:flex;align-items:center;gap:6px}
.key i{width:16px;height:11px;border-radius:2px;display:inline-block}
.duo>div:nth-child(2){border-left:1px solid var(--line)}
@media (max-width:1100px){.duo{grid-template-columns:1fr}.duo>div:nth-child(2){border-left:0;border-top:1px solid var(--line)}.duo>div,.duo svg{height:auto}.duo>.foot{grid-template-columns:1fr}.foot>.legend{border-left:0;border-top:1px solid var(--line)}}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);align-items:start}
.content{padding:20px;min-width:0}
.side{background:var(--card);border-right:1px solid var(--line);padding:16px;position:sticky;top:0;height:100vh;overflow:auto}
.sec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.sec h3{font-size:15px;margin:0 0 10px}
.fld{margin-bottom:12px}
.fl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-bottom:4px}
.fl b{color:var(--ink);font-weight:600}
.fl.sm{font-size:12px;margin-top:6px}
.side input[type=range]{width:100%}
.side label.ck{font-size:14px;margin-bottom:12px}
.side .pill{margin-top:8px}
.anchors{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.anchors button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 4px;cursor:pointer}
.anchors button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.anchors [data-p=tr]{grid-column:3}
.side .lbl{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.side select{width:100%;margin-bottom:18px}
.combo{position:relative;margin-bottom:12px}
#comboBtn{width:100%;font:inherit;font-size:14px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer}
.pop{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px}
.pop input[type=search]{width:100%;font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:6px 8px;margin-bottom:4px}
#opts{max-height:280px;overflow:auto}
#opts label{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:14px;cursor:pointer}
#opts label:hover{background:var(--bg)}
#opts .sep{border-top:1px solid var(--line);margin:4px 0}
#opts .none{padding:6px 8px;font-size:13px;color:var(--mute)}
.side #picks{flex-direction:column;gap:4px;margin:0}
.side #picks button{border-radius:8px;justify-content:flex-start;text-align:left}
@media (max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}.content{padding:16px}}
</style>
</head>
<body>
<main>
<div class="layout">
<aside class="side">
  <label class="lbl" for="mine">My monitor</label>
  <select id="mine"></select>
  <div class="lbl">Selected for comparison</div>
  <div class="combo" id="combo">
    <button type="button" id="comboBtn" aria-haspopup="listbox" aria-expanded="false"><span>Add or remove monitors</span><span aria-hidden="true">▾</span></button>
    <div class="pop" id="pop" hidden>
      <input type="search" id="q" placeholder="Search monitors" aria-label="Search monitors" autocomplete="off">
      <div id="opts" role="listbox" aria-multiselectable="true"></div>
    </div>
  </div>
  <div class="bar" id="picks"></div>

  <section class="sec">
    <h3>Front view</h3>
    <div class="fld"><span class="fl">Anchor to my monitor</span>
      <div class="anchors" id="pos">
        <button data-p="tl" aria-pressed="false">Top left</button>
        <button data-p="tr" aria-pressed="false">Top right</button>
        <button data-p="bl" aria-pressed="false">Bottom left</button>
        <button data-p="bc" aria-pressed="true">Bottom centre</button>
        <button data-p="br" aria-pressed="false">Bottom right</button>
      </div>
    </div>
    <label class="ck"><input type="checkbox" id="ghost" checked> Show my monitor</label>
  </section>

  <section class="sec">
    <h3>Seen from your chair</h3>
    <div class="fld"><span class="fl">Desk depth</span>
      <div class="seg" id="depth">
        <button data-d="600" aria-pressed="false">60 cm</button>
        <button data-d="700" aria-pressed="true">70 cm</button>
        <button data-d="800" aria-pressed="false">80 cm</button>
      </div>
    </div>
    <div class="fld"><label class="fl" for="dw">Desk width <b id="dwv"></b></label><input type="range" id="dw" min="100" max="300" step="5" value="240"></div>
    <div class="fld"><label class="fl" for="bk">Stand from back edge <b id="bkv"></b></label><input type="range" id="bk" min="0" max="30" step="1" value="0"></div>
    <div class="fld"><label class="fl" for="eye">Eyes behind desk edge <b id="eyev"></b></label><input type="range" id="eye" min="100" max="500" step="10" value="250"></div>
    <div class="fld"><label class="fl" for="yaw">View angle</label><input type="range" id="yaw" min="-55" max="55" step="1" value="28"></div>
    <label class="ck"><input type="checkbox" id="ighost" checked> Show my monitor</label>
    <div class="fld"><span class="fl">Where you look</span>
      <label class="fl sm" for="gy">Left / right</label><input type="range" id="gy" min="-70" max="70" step="1" value="0">
      <label class="fl sm" for="gp">Up / down</label><input type="range" id="gp" min="-45" max="25" step="1" value="0">
      <button class="pill" id="gc">Back to centre</button>
    </div>
  </section>
</aside>
<div class="content">

<div class="stage duo">
  <div><svg id="svg" role="img" aria-label="Front view of the selected monitor with its dimensions"></svg></div>
  <div><svg id="iso" role="img" aria-label="Axonometric view of the desk from the chair"></svg></div>
  <div class="foot"><div class="key" id="key"></div><div class="legend"><span><i class="lg a"></i>Easy focus, within 15° of your gaze</span><span><i class="lg b"></i>Eye movement, 15–30°</span><span><i class="lg c"></i>Head turn, past 30°</span><span>Click or drag on the screen to look there.</span></div></div>
</div>
</div>
</div>
</main>

<script>
var M=[
 {id:"pa27",sd:215,R:0,name:'ProArt 27" 4K',bw:612.2,bh:362.9,pw:596.7,ph:335.7,curve:"flat",res:"3840 × 2160"},
 {id:"pa32",sd:245,R:0,name:'ProArt 32" 4K',bw:727.1,bh:429,pw:708.5,ph:398.5,curve:"flat",res:"3840 × 2160",est:1},
 {id:"lg34",sd:220,R:1800,name:'LG 34U620B-B 34"',bw:809,bh:359,pw:797.2,ph:333.7,curve:"1800R",res:"3440 × 1440"},
 {id:"pa34",sd:240,R:3800,name:'ProArt PA34VCNV 34"',bw:817.2,bh:369.7,pw:799.8,ph:334.8,curve:"3800R",res:"3440 × 1440"},
 {id:"d40",sd:252.8,R:2500,name:'Dell U4025QW 40"',bw:946.6,bh:419.1,pw:929,ph:392,curve:"2500R",res:"5120 × 2160"},
 {id:"lg49",sd:260,R:3800,name:'LG 49U950A 49"',bw:1215.1,bh:365.7,pw:1198,ph:337,curve:"3800R",res:"5120 × 1440"},
 {id:"d52",sd:255,R:4200,name:'Dell U5226KW 52"',bw:1223.3,bh:529.1,pw:1207,ph:503,curve:"4200R",res:"6144 × 2560"}
];
var LIFT=92;
// my monitor keeps one colour; compared monitors draw from a palette of 30 distinct colours (Glasbey)
var MINE_COLOR="#C2459B", PALETTE=["#d60000","#8c3bff","#018700","#00acc6","#97ff00","#ff7ed1","#6b004f","#ffa52f","#573b00","#005659","#0000dd","#00fdcf","#a17569","#bcb6ff","#95b577","#002e6b","#645474","#790000","#0774d8","#fdf490","#004b00","#8e7900","#ff7266","#edb8b8","#5d7e66","#9ae4ff","#eb0077","#a57bb8","#5900a3","#03c600"];
var st={m:"pa27",colors:{},mine:"pa27",compare:M.map(function(m){return m.id}),pos:"bc",ghost:true};
var NS="http://www.w3.org/2000/svg", svg=document.getElementById("svg");
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||svg).appendChild(e);return e}
function tx(x,y,s,a){var e=el("text",Object.assign({x:x,y:y,"font-size":22,fill:"var(--mute)","font-family":"inherit"},a||{}));e.textContent=s;return e}

function byId(id){return M.filter(function(m){return m.id===id})[0]}
function cur(){return byId(st.m)}
function mine(){return byId(st.mine)}
function colorOf(m){return m.id===st.mine?MINE_COLOR:st.colors[m.id]||"var(--line)"}
// give each compared monitor a random palette colour no other compared monitor has
function assignColors(){
  for(var id in st.colors)if(st.compare.indexOf(id)<0)delete st.colors[id];
  st.compare.forEach(function(id){
    if(st.colors[id])return;
    var used=Object.keys(st.colors).map(function(k){return st.colors[k]}),free=PALETTE.filter(function(c){return used.indexOf(c)<0});

}
// st.pos names the point of my monitor the compared one shares: b/t + l/c/r
function left(m){var y=mine();return st.pos[1]==="l"?-y.bw/2:st.pos[1]==="c"?-m.bw/2:y.bw/2-m.bw}
function base(m){var y=mine();return st.pos[0]==="b"?LIFT:LIFT+y.bh-m.bh}
function dim(x1,x2,y,label,c,below){

  el("line",{x1:x1,y1:y,x2:x2,y2:y,stroke:c,"stroke-width":2});
  el("line",{x1:x1,y1:y-10,x2:x1,y2:y+10,stroke:c,"stroke-width":2});
  el("line",{x1:x2,y1:y-10,x2:x2,y2:y+10,stroke:c,"stroke-width":2});
  tx((x1+x2)/2,below?y+32:y-10,label,{"text-anchor":"middle",fill:c,"font-weight":600});
}
function vdim(x,b,t,label,c,toLeft){
  c=c||"var(--ink)";
  el("line",{x1:x,y1:-b,x2:x,y2:-t,stroke:c,"stroke-width":2});
  el("line",{x1:x-10,y1:-t,x2:x+10,y2:-t,stroke:c,"stroke-width":2});
  el("line",{x1:x-10,y1:-b,x2:x+10,y2:-b,stroke:c,"stroke-width":2});

function monitor(m,x,b,ghost){
  var y=-(b+m.bh), foot=b-LIFT, g=el("g",{});
  if(ghost){el("rect",{x:x,y:y,width:m.bw,height:m.bh,rx:6,fill:"none",stroke:colorOf(m),"stroke-width":3,"stroke-dasharray":"12 9",opacity:.9},g);return}
  var cx=x+m.bw/2;
  el("rect",{x:cx-130,y:-foot-10,width:260,height:10,rx:5,fill:"#9a9a9e"},g);
  el("rect",{x:cx-30,y:-(b+m.bh*0.55),width:60,height:LIFT+m.bh*0.55-6,fill:"#a7a7ab"},g);
  el("rect",{x:x,y:y,width:m.bw,height:m.bh,rx:6,fill:"var(--bezel)"},g);
  var side=(m.bw-m.pw)/2;
  el("rect",{x:x+side,y:y+side,width:m.pw,height:m.ph,rx:2,fill:colorOf(m),"fill-opacity":.32,stroke:colorOf(m),"stroke-width":3},g);
}
// crop the drawing to what was drawn, so it fills its half of the panel
function fit(s,pad){var b=s.getBBox();s.setAttribute("viewBox",[b.x-pad,b.y-pad,b.width+2*pad,b.height+2*pad].map(Math.round).join(" "))}
function draw(){
  svg.textContent="";
  var m=cur(), x=left(m), r=x+m.bw, b=base(m), top=b+m.bh;
  monitor(m,x,b,false);
  if(st.ghost && m.id!==st.mine) monitor(mine(),-mine().bw/2,LIFT,true);
  // dims
  var y=mine(), yl=-y.bw/2, yt=LIFT+y.bh, hi=-Math.max(top,yt), L=Math.min(x,yl), R=Math.max(r,-yl);
  // compared monitor on top and right; my monitor, in its own colour, on the bottom and left
  dim(x,r,hi-40,cm(m.bw)+" wide");
  vdim(R+30,b,top,cm(m.bh)+" tall");
  if(st.ghost && m.id!==st.mine){
    dim(yl,-yl,Math.max(0,LIFT-b)+40,cm(y.bw)+" wide",colorOf(y),true);
    vdim(L-30,LIFT,yt,cm(y.bh)+" tall",colorOf(y),true);
  }
  fit(svg,30);
  // legend: compared monitor solid (top and right sizes), mine dashed (bottom and left sizes)
  var key=document.getElementById("key");key.textContent="";
  function item(mon,dashed,where){var sp=document.createElement("span"),i=document.createElement("i");
    i.style.cssText=dashed?"border:2px dashed "+colorOf(mon):"background:"+colorOf(mon);
    sp.appendChild(i);sp.appendChild(document.createTextNode(mon.name+" · "+where));key.appendChild(sp)}
  var both=st.ghost && m.id!==st.mine;
  item(m,false,(m.id===st.mine?"your monitor, ":"")+"sizes top and right");
  if(both)item(y,true,"your monitor, sizes bottom and left");

var picks=document.getElementById("picks"), mineSel=document.getElementById("mine");
var combo=document.getElementById("combo"), comboBtn=document.getElementById("comboBtn"), pop=document.getElementById("pop"), q=document.getElementById("q"), opts=document.getElementById("opts"), optOrder=[];
function sw(m){var s=document.createElement("span");s.className="sw";s.style.background=colorOf(m);return s}
// the monitors selected for comparison; my monitor is never one of them
function renderPicks(){
  assignColors();
  var shown=M.filter(function(m){return m.id!==st.mine&&st.compare.indexOf(m.id)>=0});
  if(!shown.some(function(m){return m.id===st.m}))st.m=shown.length?shown[0].id:st.mine;
  picks.textContent="";
  shown.forEach(function(m){
    var b=document.createElement("button");b.setAttribute("aria-pressed",m.id===st.m);
    b.appendChild(sw(m));b.appendChild(document.createTextNode(m.name));
    b.onclick=function(){st.m=m.id;renderPicks();draw()};
    picks.appendChild(b);
  });
}
// comparison dropdown: selected ones sit on top, checked; the order is fixed when it opens so rows don't jump while toggling
function renderOpts(){
  var term=q.value.trim().toLowerCase();opts.textContent="";
  var rows=optOrder.filter(function(m){return m.id!==st.mine&&m.name.toLowerCase().indexOf(term)>=0}),sep=false;
  rows.forEach(function(m,i){
    if(i&&!sep&&!m.wasOn&&rows[i-1].wasOn){var d=document.createElement("div");d.className="sep";opts.appendChild(d);sep=true}
    var l=document.createElement("label"),c=document.createElement("input");l.setAttribute("role","option");
    c.type="checkbox";c.checked=st.compare.indexOf(m.id)>=0;l.setAttribute("aria-selected",c.checked);
    c.onchange=function(){st.compare=c.checked?st.compare.concat(m.id):st.compare.filter(function(id){return id!==m.id});l.setAttribute("aria-selected",c.checked);renderPicks();draw()};
    l.appendChild(c);l.appendChild(document.createTextNode(m.name));opts.appendChild(l);
  });
  if(!rows.length){var n=document.createElement("div");n.className="none";n.textContent="No monitors match";opts.appendChild(n)}
}
function openCombo(){
  optOrder=M.map(function(m){return {id:m.id,name:m.name,wasOn:st.compare.indexOf(m.id)>=0}});
  optOrder.sort(function(a,b){return b.wasOn-a.wasOn});
  q.value="";pop.hidden=false;comboBtn.setAttribute("aria-expanded","true");renderOpts();q.focus();
}
function closeCombo(){pop.hidden=true;comboBtn.setAttribute("aria-expanded","false")}
comboBtn.onclick=function(){pop.hidden?openCombo():closeCombo()};
q.oninput=renderOpts;
document.addEventListener("mousedown",function(e){if(!pop.hidden&&!combo.contains(e.target))closeCombo()});
combo.addEventListener("keydown",function(e){if(e.key==="Escape"&&!pop.hidden){closeCombo();comboBtn.focus()}});
M.forEach(function(m){var o=document.createElement("option");o.value=m.id;o.textContent=m.name;mineSel.appendChild(o)});
mineSel.value=st.mine;
mineSel.onchange=function(){st.mine=mineSel.value;renderPicks();draw()};
renderPicks();
var pos=document.getElementById("pos");
[].forEach.call(pos.children,function(b){b.onclick=function(){st.pos=b.dataset.p;[].forEach.call(pos.children,function(c){c.setAttribute("aria-pressed",c===b)});draw()}});
document.getElementById("ghost").onchange=function(e){st.ghost=e.target.checked;draw()};

var IS=document.getElementById("iso"), ist={D:700,W:2400,back:0,eye:250,yaw:28,ghost:true,gy:null,gp:null,drag:false,lastM:null}, PITCH=32*Math.PI/180, EYEH=450;
function E(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);IS.appendChild(e);return e}
function P(x,y,h){var a=ist.yaw*Math.PI/180,sx=x*Math.cos(a)-y*Math.sin(a),dz=x*Math.sin(a)+y*Math.cos(a);return [sx,-h*Math.cos(PITCH)+dz*Math.sin(PITCH)]}
function poly(pts,a){E("polygon",Object.assign({points:pts.map(function(p){var q=P(p[0],p[1],p[2]);return q[0].toFixed(1)+","+q[1].toFixed(1)}).join(" ")},a))}
function box(x0,x1,y0,y1,h0,h1,fill,stroke){
  var s=stroke||"var(--shelfline)",a=ist.yaw;
  poly([[x0,y1,h0],[x1,y1,h0],[x1,y1,h1],[x0,y1,h1]],{fill:fill,stroke:s,"stroke-width":2});
  if(a>0)poly([[x1,y0,h0],[x1,y1,h0],[x1,y1,h1],[x1,y0,h1]],{fill:fill,stroke:s,"stroke-width":2,"fill-opacity":.85});
  else poly([[x0,y0,h0],[x0,y1,h0],[x0,y1,h1],[x0,y0,h1]],{fill:fill,stroke:s,"stroke-width":2,"fill-opacity":.85});
  poly([[x0,y0,h1],[x1,y0,h1],[x1,y1,h1],[x0,y1,h1]],{fill:fill,stroke:s,"stroke-width":2});
}
function line3(a,b,at){var p=P(a[0],a[1],a[2]),q=P(b[0],b[1],b[2]);E("line",Object.assign({x1:p[0],y1:p[1],x2:q[0],y2:q[1]},at))}
// the chair view ignores the front-view anchor: every monitor stands centred on the desk
function screenFace(m){var x=-m.bw/2,cx=x+m.bw/2,pz=ist.back+m.sd*0.6,R=m.R,N=24,pts=[];
  for(var i=0;i<=N;i++){var u=-m.bw/2+m.bw*i/N,b=R?R-Math.sqrt(R*R-u*u):0,b0=R?R-Math.sqrt(R*R-m.bw*m.bw/4):0;pts.push([cx+u,pz+b-b0/2])}
  return {pts:pts,cx:cx,pz:pz};}
function drawIso(){
  IS.textContent="";var m=cur(),D=ist.D,eyeY=D+ist.eye;
  var XR=ist.W/2,XL=-XR;
  // desk top
  box(XL,XR,0,D,-25,0,"var(--desk)");
  var f=screenFace(m),cx=f.cx,lowH=LIFT,topH=LIFT+m.bh,side=(m.bw-m.pw)/2;
  // stand
  box(cx-130,cx+130,ist.back,ist.back+m.sd,0,10,"#9a9a9e","#7d7d82");
  box(cx-30,cx+30,f.pz-55,f.pz-25,10,LIFT+m.bh*0.55,"#a7a7ab","#7d7d82");
  // back + face
  var back=f.pts.map(function(p){return [p[0],p[1]-35]});
  poly(back.map(function(p){return [p[0],p[1],lowH]}).concat(back.slice().reverse().map(function(p){return [p[0],p[1],topH]})),{fill:"#3a3b3f",stroke:"#2a2a2d"});
  var face=f.pts.map(function(p){return [p[0],p[1],lowH]}).concat(f.pts.slice().reverse().map(function(p){return [p[0],p[1],topH]}));
  poly(face,{fill:"var(--bezel)",stroke:"#000","stroke-width":1.5});
  var inner=f.pts.filter(function(p){return p[0]>=cx-m.pw/2-1&&p[0]<=cx+m.pw/2+1});
  inner[0]=[cx-m.pw/2,inner[0][1]];inner[inner.length-1]=[cx+m.pw/2,inner[inner.length-1][1]];
  poly(inner.map(function(p){return [p[0],p[1]+1,topH-side-m.ph]}).concat(inner.slice().reverse().map(function(p){return [p[0],p[1]+1,topH-side]})),{fill:colorOf(m),"fill-opacity":.45,stroke:colorOf(m),"stroke-width":2.5});
  // ghost of my monitor
  if(ist.ghost && m.id!==st.mine){var g=mine(),gz=ist.back+g.sd*0.6,gx=-g.bw/2,gh0=LIFT,gh1=LIFT+g.bh,gs={fill:"none",stroke:colorOf(g),"stroke-width":3,"stroke-dasharray":"12 9"};
    poly([[gx,gz,gh0],[gx+g.bw,gz,gh0],[gx+g.bw,gz,gh1],[gx,gz,gh1]],gs);
    poly([[-130,ist.back,0],[130,ist.back,0],[130,ist.back+g.sd,0],[-130,ist.back+g.sd,0]],gs);
    line3([0,gz-40,0],[0,gz-40,gh0],gs);}
  // gaze zones over the panel
  if(ist.lastM!==m.id){ist.gy=null;ist.gp=null;ist.lastM=m.id}
  var ex=0,ey=eyeY,eh=EYEH,hb=topH-side-m.ph,ht=topH-side;
  var b0=m.R?m.R-Math.sqrt(m.R*m.R-m.bw*m.bw/4):0;
  function sy(x){var u=x-cx;return f.pz+(m.R?m.R-Math.sqrt(m.R*m.R-u*u):0)-b0/2+2}
  function dir(x,y,h){var dx=x-ex,dy=ey-y,dh=h-eh,n=Math.sqrt(dx*dx+dy*dy+dh*dh);return [dx/n,dy/n,dh/n]}
  function angs(x,y,h){var d=dir(x,y,h);return [Math.atan2(d[0],d[1])*180/Math.PI,Math.asin(d[2])*180/Math.PI]}
  if(ist.gy===null){var c0=angs(cx,sy(cx),(hb+ht)/2);ist.gy=Math.round(c0[0]);ist.gp=Math.round(c0[1])}
  document.getElementById("gy").value=ist.gy;document.getElementById("gp").value=ist.gp;
  var gr=ist.gy*Math.PI/180,gpr=ist.gp*Math.PI/180,G=[Math.sin(gr)*Math.cos(gpr),Math.cos(gr)*Math.cos(gpr),Math.sin(gpr)];
  var NC=36,NR=12,best=null,bestA=1e9;
  for(var i=0;i<NC;i++)for(var j=0;j<NR;j++){
    var xa=cx-m.pw/2+m.pw*i/NC,xb=cx-m.pw/2+m.pw*(i+1)/NC,ha=hb+m.ph*j/NR,hb2=hb+m.ph*(j+1)/NR,xm=(xa+xb)/2,hm=(ha+hb2)/2,d=dir(xm,sy(xm),hm);
    var a=Math.acos(Math.max(-1,Math.min(1,d[0]*G[0]+d[1]*G[1]+d[2]*G[2])))*180/Math.PI;
    if(a<bestA){bestA=a;best=[xm,sy(xm),hm]}
    var fill=a<=15?"#fff6c8":a<=30?"#000":"#000",op=a<=15?.55:a<=30?0.0:.6;
    var q=E("polygon",{"class":"q",points:[[xa,sy(xa),ha],[xb,sy(xb),ha],[xb,sy(xb),hb2],[xa,sy(xa),hb2]].map(function(p){var r=P(p[0],p[1],p[2]);return r[0].toFixed(1)+","+r[1].toFixed(1)}).join(" "),fill:fill,"fill-opacity":op,stroke:fill,"stroke-opacity":op,"stroke-width":1.2});
    (function(x,y,h){q.addEventListener("pointerdown",function(e){e.preventDefault();ist.drag=true;look(x,y,h)});q.addEventListener("pointerenter",function(){if(ist.drag)look(x,y,h)})})(xm,sy(xm),hm);
  }
  function look(x,y,h){var a=angs(x,y,h);ist.gy=Math.round(a[0]);ist.gp=Math.round(a[1]);drawIso()}
  var gaze=bestA<8?best:null;
  // keyboard + mouse, centred on the desk
  box(-180,180,D-230,D-100,0,22,"#2b2b2e","#1a1a1c");
  box(240,300,D-210,D-110,0,30,"#d9d9dc","#aaa");
  // chair
  var cy=eyeY+60;
  box(-230,230,cy-200,cy+230,-310,-250,"#55565a","#3c3d40");
  box(-230,230,cy+190,cy+240,-250,250,"#55565a","#3c3d40");
  // sight lines
  var eye=[0,eyeY,EYEH],cH=topH-side-m.ph/2,L=inner[0],Rr=inner[inner.length-1],mid=f.pts[Math.floor(f.pts.length/2)];
  [[L[0],L[1],cH],[Rr[0],Rr[1],cH]].forEach(function(t){line3(eye,t,{stroke:"var(--ink)","stroke-width":2,"stroke-dasharray":"10 8"})});
  line3(eye,[mid[0],mid[1],cH],{stroke:"var(--ink)","stroke-width":1.5,opacity:.5});
  if(gaze){line3(eye,gaze,{stroke:"#e0a800","stroke-width":3});var gp2=P(gaze[0],gaze[1],gaze[2]);E("circle",{cx:gp2[0],cy:gp2[1],r:12,fill:"#e0a800",stroke:"#000","stroke-width":2})}
  line3(eye,[0,eyeY,-250],{stroke:"var(--ink)","stroke-width":2,"stroke-dasharray":"3 7",opacity:.6});var ep=P(eye[0],eye[1],eye[2]);E("circle",{cx:ep[0],cy:ep[1],r:14,fill:"var(--ink)"});
  var t=E("text",{x:ep[0]-24,y:ep[1]+10,"text-anchor":"end","font-size":30,fill:"var(--ink)","font-weight":600});t.textContent="your eyes, 45 cm above the desk";
  document.getElementById("eyev").textContent=(ist.eye/10)+" cm";
  document.getElementById("dwv").textContent=(ist.W/10)+" cm";
  document.getElementById("bkv").textContent=(ist.back/10)+" cm";
  fit(IS,40);
}
var depth=document.getElementById("depth");
[].forEach.call(depth.children,function(b){b.onclick=function(){ist.D=+b.dataset.d;[].forEach.call(depth.children,function(c){c.setAttribute("aria-pressed",c===b)});drawIso()}});
document.getElementById("bk").oninput=function(e){ist.back=+e.target.value*10;drawIso()};
document.getElementById("dw").oninput=function(e){ist.W=+e.target.value*10;drawIso()};
document.getElementById("eye").oninput=function(e){ist.eye=+e.target.value;drawIso()};
document.getElementById("ighost").onchange=function(e){ist.ghost=e.target.checked;drawIso()};
document.getElementById("yaw").oninput=function(e){ist.yaw=+e.target.value;drawIso()};
window.addEventListener("pointerup",function(){ist.drag=false});
document.getElementById("gy").oninput=function(e){ist.gy=+e.target.value;drawIso()};
document.getElementById("gp").oninput=function(e){ist.gp=+e.target.value;drawIso()};
document.getElementById("gc").onclick=function(){ist.gy=null;ist.gp=null;drawIso()};
var _draw=draw;draw=function(){_draw();drawIso()};
draw();
</script>
